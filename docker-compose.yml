# Hermes Agent — stack for Raspberry Pi 5.
#
# Deploy as its OWN Portainer stack. Outbound-only: Telegram long-polling + the
# cloud LLM API are both outbound, so there are NO published ports and NO
# inbound access. Keep it OFF `public-net` and off the Cloudflare tunnel.
#
# Two services: `hermes` (the agent) and `supermemory` (self-hosted semantic
# memory provider). Supermemory is INTERNAL-ONLY — it publishes no ports and
# shares hermes's network namespace (see its block below).
#
# Execution model (see docs/ARCHITECTURE.md): the agent runs AS the unprivileged
# `hermes-runner` user (uid 1000) and drives code execution through that user's
# ROOTLESS Podman socket — NOT the root Docker socket. A compromised agent is
# therefore capped at uid-1000 privileges: no root, host OS / other users / other
# Portainer stacks stay safe. (Blast radius is still the whole hermes-runner user
# — not "just a temp container" — so keep nothing valuable in its reach.)
#
# The image is built locally from a clone of the upstream source
# (github.com/NousResearch/hermes-agent), tagged `hermes-agent:latest`.
# Config + secrets + memory live under ~/.hermes on the host (mounted /opt/data);
# the app reads config.yaml and .env from there itself.

services:
  hermes:
    image: hermes-agent:latest
    pull_policy: never
    container_name: hermes
    restart: unless-stopped

    # Dedicated bridge network — isolated from public-net / the tunnel.
    networks:
      - hermes-net

    volumes:
      # Persistent config.yaml, .env, MEMORY.md, USER.md, skills, session DB.
      # DO NOT remove or relabel — this is the agent's entire state.
      # ABSOLUTE PATH: Portainer does NOT expand `~`, so a `~/.hermes` here
      # silently resolves to `/.hermes` (empty) and the agent boots blank.
      - /home/lantonyk/.hermes:/opt/data

      # Docker socket — the hermes-docker-gate plugin drives Docker through this.
      # Access is gated IN-PROCESS by the plugin: reads are redacted, writes require
      # Telegram approval, and the raw terminal is blocked from touching docker.
      # Deliberately NO socket-proxy. uid-1000 reaches the socket via group_add below.
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      # Run the gateway as uid/gid 1000 so ~/.hermes files stay owned by that user
      # (and, once enabled, so it can access the rootless Podman socket).
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}

      # Point the docker CLI at the mounted socket (no proxy). Access is gated
      # in-process by the hermes-docker-gate plugin.
      - DOCKER_HOST=unix:///var/run/docker.sock

    # Host 'docker' group so the uid-1000 gateway can access the mounted socket.
    # 985 = `stat -c %g /var/run/docker.sock` on this Pi — update if it changes.
    group_add:
      - "985"

    command: ["gateway", "run"]

    # Prevent privilege escalation via setuid binaries inside the container.
    # (Safe with the entrypoint's normal privilege *drop*.) If the container
    # fails to start, remove this line and check logs, then re-add.
    security_opt:
      - no-new-privileges:true
    # NOTE: do NOT `cap_drop: [ALL]` blindly — the entrypoint needs CHOWN /
    # SETUID / SETGID to drop to HERMES_UID. Test before tightening capabilities.

    # Pi 5 resource guards. Tune to taste; the agent is network/IO-bound (work
    # happens in the cloud LLM + in the sandboxes it spawns, not in this process).
    # Bumped 1536M -> 3072M: the old 1.5G cap was already ~50% used AND the host
    # was swapping ~740M, so it was tight even before adding a memory provider.
    # Host has ~5.7G available on this 8GB Pi 5, so 3G is safe and leaves room for
    # the OS, a memory-provider service, and Podman.
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 3072M
        reservations:
          memory: 1024M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Memory provider (Supermemory) ---------------------------------------
  # Self-hosted semantic memory for the agent. Its OWN container (own volume,
  # own RAM budget), but it SHARES hermes's network namespace: the server
  # hardwires its listener to localhost:6767 with NO bind-address override
  # (verified on v0.0.6), so the only way hermes can reach it is to share
  # localhost. Internal-only — NO published ports, nothing on the LAN.
  #
  # Portainer builds this image from the repo on redeploy (same GitOps `build:`
  # pattern as the job-radar stack). No manual pre-build needed.
  supermemory:
    build:
      context: .
      dockerfile: Dockerfile.supermemory
    image: hermes-supermemory:latest    # tag for the locally-built image
    # Never pull from a registry — this image only exists locally (built above).
    # Without this, a Portainer "re-pull and redeploy" tries to `docker compose pull`
    # it from Docker Hub and fails with "pull access denied". Build happens only when
    # the image is missing; otherwise the local image is used as-is.
    pull_policy: never
    container_name: supermemory
    restart: unless-stopped
    depends_on:
      - hermes                       # hermes's network namespace must exist first

    # Share hermes's network stack → hermes reaches it at http://localhost:6767.
    # With this set, the service must NOT declare its own `networks:` or `ports:`.
    network_mode: "service:hermes"

    # Run as the same unprivileged uid as the host owner so /data stays owned by
    # lantonyk (uid 1000) and is easy to back up. The image opened the binary
    # read/execute for this user.
    user: "1000:1000"

    volumes:
      # Encrypted memory store + local embedding-model cache. ABSOLUTE host path
      # (Portainer does not expand ~). Create + chown first:
      #   mkdir -p /home/lantonyk/.supermemory-data
      #   sudo chown -R 1000:1000 /home/lantonyk/.supermemory-data
      - /home/lantonyk/.supermemory-data:/data

    environment:
      # Memory-EXTRACTION LLM (distills stored chunks into searchable memories — NOT the
      # chat model; Claude still runs the conversation). Routed through DEEPSEEK via its
      # OpenAI-COMPATIBLE endpoint (OPENAI_* vars). WHY DeepSeek: every Groq model
      # (gpt-oss, llama-3.3) crashed the self-hosted memory agent INSTANTLY (~66ms, 0
      # memories) — Groq's structured-output support isn't strict enough for the agent's
      # JSON-schema calls. DeepSeek (a faithful OpenAI-compatible impl) completes the
      # agent cleanly (~3.7s, real memories, semantic search returns content) and is
      # extremely cheap. Verified end-to-end in an isolated container 2026-07-31.
      # Set DEEPSEEK_API_KEY (sk-...) as a Portainer stack env var; deploy FAILS loud if unset.
      - OPENAI_API_KEY=${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY as a Portainer stack / compose env var}
      - OPENAI_BASE_URL=https://api.deepseek.com
      - OPENAI_MODEL=deepseek-chat
      - OPENAI_TEXT_MODEL=deepseek-chat
      - OPENAI_FAST_MODEL=deepseek-chat
      - SUPERMEMORY_DATA_DIR=/data
      - HOME=/data
      - SUPERMEMORY_DISABLE_TELEMETRY=1
      # Bound embedding RAM so ingest can't blow the container limit below.
      - SUPERMEMORY_EMBEDDING_RAM_LIMIT=1gb

    security_opt:
      - no-new-privileges:true

    # Own RAM budget: ~1.1G baseline + up to 1G ingest. Separate cgroup from
    # hermes despite the shared network namespace. Host has ~5.7G free.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2560M
        reservations:
          memory: 1024M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  hermes-net:
    driver: bridge
